name: publish-lab-02

on:
  push:
    paths:
      - "lab-02/**"
      - ".github/workflows/publish-lab-02.yml"
  pull_request:
    paths:
      - "lab-02/**"
      - ".github/workflows/publish-lab-02.yml"

# Permissions for GITHUB_TOKEN
permissions:
  contents: read # Allow reading the repository

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4 # Download repository code
      - uses: actions/setup-python@v5 # Set up Python
        with:
          python-version: "3.11"
      - run: python -m pip install -r lab-02/requirements.txt -r lab-02/requirements-dev.txt # Install app and testing dependencies
      - run: python -m pytest -q lab-02/tests # Run tests (-q = shorter output)

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4 # Get code on a new runner
      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "catshop-lab-02:${GITHUB_SHA}" lab-02
      - name: Save image
        run: docker save "catshop-lab-02:${GITHUB_SHA}" -o image.tar # Save the Docker image as a tar file
      - uses: actions/upload-artifact@v4 # Upload the image to the artifact storage on GitHub so the next job can use it
        with:
          name: lab-02-image
          path: image.tar
          retention-days: 1

  publish:
    if: github.event_name == 'push' # Skip publishing on pull requests
    needs: [test, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4 # Download the image saved by the build job
        with:
          name: lab-02-image
      - run: docker load -i image.tar # Load the Docker image from the tar file
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        run: |
          IMAGE="ghcr.io/olenapopova05/catshop-lab-02:${GITHUB_SHA}" # Full image name in GHCR
          docker tag "catshop-lab-02:${GITHUB_SHA}" "$IMAGE" # Tag the existing image for GHCR
          docker push "$IMAGE" # Publish the image to GHCR
